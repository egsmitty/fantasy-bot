name: Fantasy Football Lineup Check

on:
  schedule:
    # Runs every 2 hours, all day. Adjust as you like (cron is in UTC).
    - cron: '0 */2 * * *'
  workflow_dispatch: {}  # lets you manually trigger a run from the GitHub Actions tab

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lineup check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated state file
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add last_state.json
          git diff --staged --quiet || git commit -m "Update player state"
          git push
