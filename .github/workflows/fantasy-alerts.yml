name: Fantasy Football Lineup Check

on:
  schedule:
    # Every day: morning (8am CT) and night (7pm CT) — covers Mon/Thu games too
    - cron: '0 13 * * *'
    - cron: '0 0 * * *'

    # Sundays only: 11am, 2pm, 5pm CT (9pm is already covered by the nightly one above)
    - cron: '0 16 * * 0'
    - cron: '0 19 * * 0'
    - cron: '0 22 * * 0'

  workflow_dispatch: {}

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run lineup check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fetch_user.py
